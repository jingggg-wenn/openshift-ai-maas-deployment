apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen36-27b
  namespace: workshop-REPLACE_USERNAME
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
  annotations:
    openshift.io/display-name: "Qwen 3.6 27B FP8"
    security.opendatahub.io/enable-auth: "false"
spec:
  model:
    name: qwen36-27b
    uri: hf://RedHatAI/Qwen3.6-27B-FP8
  replicas: 1
  router:
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    route: {}
    scheduler: {}
  template:
    containers:
      - name: main
        env:
          - name: VLLM_ADDITIONAL_ARGS
            value: "--max-model-len=32768 --gpu-memory-utilization=0.90 --enforce-eager --enable-auto-tool-choice --tool-call-parser=hermes"
        resources:
          requests:
            cpu: "4"
            memory: 32Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: 48Gi
            nvidia.com/gpu: "1"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
